<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deel je ervaring · Rise Like A Phoenix</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261108113603">
</head>
<body data-page="review">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="hero-bg"></div>
      <div class="container reveal">
        <span class="eyebrow">Jouw ervaring</span>
        <h1>Hoe was het voor jou?</h1>
        <p class="lead">Je woorden helpen anderen die twijfelen om de stap te zetten. Merci om dit te delen!</p>
      </div>
    </section>
    <section class="section">
      <div class="container narrow">
        <div class="card" style="max-width:720px;margin:0 auto;padding:32px">
          <form class="form" id="review-form" novalidate>
            <div class="field"><label for="r-naam">Je naam <span class="req">*</span></label><input id="r-naam" name="naam" type="text" maxlength="80" autocomplete="name"><span class="hint">Op de site tonen we je voornaam en de eerste letter van je achternaam.</span></div>
            <div class="field"><span class="label">Hoe tevreden ben je? <span class="req">*</span></span>
              <div class="choice-group" role="radiogroup">
                <label class="choice"><input type="radio" name="sterren" value="5" checked><span>★★★★★</span></label>
                <label class="choice"><input type="radio" name="sterren" value="4"><span>★★★★</span></label>
                <label class="choice"><input type="radio" name="sterren" value="3"><span>★★★</span></label>
                <label class="choice"><input type="radio" name="sterren" value="2"><span>★★</span></label>
                <label class="choice"><input type="radio" name="sterren" value="1"><span>★</span></label>
              </div>
            </div>
            <div class="field"><label for="r-tekst">Wat hebben de sessies voor jou betekend? <span class="req">*</span></label><textarea id="r-tekst" name="tekst" maxlength="3000" style="min-height:180px"></textarea></div>
            <label class="checkbox"><input type="checkbox" name="toestemming" checked> <span>Nathalie mag mijn ervaring op de website tonen.</span></label>
            <div class="honey" aria-hidden="true"><label>Laat leeg <input name="website" tabindex="-1" autocomplete="off"></label></div>
            <div class="form-msg" id="review-msg" role="alert"></div>
            <div><button class="btn btn-primary" type="submit">Verstuur <span class="arrow">→</span></button></div>
          </form>
          <div id="review-done" class="hidden center">
            <div data-phoenix style="width:120px;margin:0 auto 10px"></div>
            <h2>Dankjewel!</h2>
            <p class="muted">Je ervaring is goed ontvangen. 💛</p>
            <a class="btn btn-ghost" href="index.html">Naar de homepagina</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js?v=20261108113603"></script>
  <script src="js/questions.js?v=20261108113603"></script>
  <script src="js/data.js?v=20261108113603"></script>
  <script src="js/layout.js?v=20261108113603"></script>
  <script src="js/pages.js?v=20261108113603"></script>
</body>
</html>
